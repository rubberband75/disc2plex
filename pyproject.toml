[project]
name = "disc2plex"
version = "0.1.0"
description = "Identify, rename, and organize MakeMKV TV-series rips into a Plex-compliant library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "typer>=0.12",
]

[project.scripts]
disc2plex = "disc2plex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disc2plex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# faster-whisper ships no type information; it is used through a narrow wrapper.
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
